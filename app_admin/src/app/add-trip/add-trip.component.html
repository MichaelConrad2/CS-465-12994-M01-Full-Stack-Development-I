<div class="row justify-content-center">

  <div class="col-md-8 col-lg-6">

    <h2 class="text-center mb-4">
      Add Trip
    </h2>

    <form *ngIf="addForm"
          [formGroup]="addForm"
          (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label">Code:</label>

        <input type="text"
               formControlName="code"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['code'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['code'].errors">
          Trip Code is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Name:</label>

        <input type="text"
               formControlName="name"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['name'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['name'].errors">
          Name is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Length:</label>

        <input type="text"
               formControlName="length"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['length'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['length'].errors">
          Length is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Start:</label>

        <input type="date"
               formControlName="start"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['start'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['start'].errors">
          Start date is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Resort:</label>

        <input type="text"
               formControlName="resort"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['resort'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['resort'].errors">
          Resort is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Per Person:
        </label>

        <input type="text"
               formControlName="perPerson"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['perPerson'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['perPerson'].errors">
          Per Person is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Image Name:
        </label>

        <input type="text"
               formControlName="image"
               class="form-control"
               [ngClass]="{
            'is-invalid':
              submitted && f['image'].errors
          }">

        <div class="invalid-feedback"
             *ngIf="submitted && f['image'].errors">
          Image Name is required.
        </div>
      </div>

      <div class="mb-3">

        <label class="form-label">
          Description:
        </label>

        <textarea formControlName="description"
                  class="form-control"
                  rows="4"
                  [ngClass]="{
            'is-invalid':
              submitted && f['description'].errors
          }">
        </textarea>

        <div class="invalid-feedback"
             *ngIf="
            submitted &&
            f['description'].errors
          ">
          Description is required.
        </div>

      </div>

      <button type="submit"
              class="btn btn-success me-2">
        Save
      </button>

      <button type="button"
              class="btn btn-secondary"
              (click)="cancel()">
        Cancel
      </button>

    </form>

  </div>
</div>
