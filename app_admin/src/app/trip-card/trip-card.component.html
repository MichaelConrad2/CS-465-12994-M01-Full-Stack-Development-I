<div class="card h-100">

  <img *ngIf="trip.image"
       src="assets/images/{{ trip.image }}"
       alt="{{ trip.name }}"
       class="card-img-top">

  <div class="card-header">
    {{ trip.name }}
  </div>

  <div class="card-body">

    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }}
      only
      {{ trip.perPerson | currency:'USD':'symbol' }}
      per person
    </p>

    <p class="card-text"
       [innerHTML]="trip.description">
    </p>

  </div>

  <div class="card-footer">

    <button class="btn btn-primary me-2"
            type="button"
            (click)="editTrip(trip)">
      Edit Trip
    </button>

    <button class="btn btn-danger"
            type="button"
            (click)="deleteTrip(trip)">
      Delete
    </button>

  </div>

</div>
