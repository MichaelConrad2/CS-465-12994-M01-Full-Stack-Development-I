<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Trip Listing</h2>

  <button class="btn btn-primary"
          type="button"
          *ngIf="isLoggedIn()"
          (click)="addTrip()">
    Add Trip
  </button>
</div>

<p>{{ message }}</p>

<div class="row">
  <div *ngFor="let trip of trips"
       class="col-12 col-md-4 mb-4">

    <app-trip-card [trip]="trip">
    </app-trip-card>

  </div>
</div>
